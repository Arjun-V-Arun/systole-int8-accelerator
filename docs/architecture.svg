<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">sa_top: Output-Stationary INT8 Systolic Array (4x4 shown)</text>

  <!-- Input stream -->
  <rect x="20" y="60" width="150" height="70" rx="6" fill="#eef4ff" stroke="#3b6fd6"/>
  <text x="95" y="82" text-anchor="middle" font-weight="bold" fill="#1d3f8a">Input Stream</text>
  <text x="95" y="100" text-anchor="middle" fill="#333">beat k: A[:,k], B[k,:]</text>
  <text x="95" y="117" text-anchor="middle" fill="#333">valid / ready / last</text>

  <!-- FSM -->
  <rect x="20" y="380" width="150" height="110" rx="6" fill="#fff6e8" stroke="#d08a1e"/>
  <text x="95" y="402" text-anchor="middle" font-weight="bold" fill="#8a5408">Control FSM</text>
  <text x="95" y="422" text-anchor="middle" fill="#333">LOAD: 1 step per beat</text>
  <text x="95" y="440" text-anchor="middle" fill="#333">FLUSH: R+C-2 (+1) steps</text>
  <text x="95" y="458" text-anchor="middle" fill="#333">DRAIN: R output rows</text>
  <text x="95" y="478" text-anchor="middle" fill="#8a5408">step, clear, row_idx</text>

  <!-- Skew A (left triangle of delay stages) -->
  <text x="235" y="160" text-anchor="middle" font-weight="bold" fill="#1d3f8a">Skew A</text>
  <g fill="#dbe7ff" stroke="#3b6fd6">
    <rect x="268" y="244" width="16" height="22"/>
    <rect x="248" y="314" width="16" height="22"/><rect x="268" y="314" width="16" height="22"/>
    <rect x="228" y="384" width="16" height="22"/><rect x="248" y="384" width="16" height="22"/><rect x="268" y="384" width="16" height="22"/>
  </g>
  <text x="235" y="176" text-anchor="middle" font-size="11" fill="#555">row r delayed r steps</text>

  <!-- Skew B -->
  <text x="700" y="90" text-anchor="middle" font-weight="bold" fill="#1d3f8a">Skew B</text>
  <text x="700" y="108" text-anchor="middle" font-size="11" fill="#555">column c delayed c steps</text>
  <g fill="#dbe7ff" stroke="#3b6fd6">
    <rect x="399" y="118" width="22" height="16"/>
    <rect x="469" y="98" width="22" height="16"/><rect x="469" y="118" width="22" height="16"/>
    <rect x="539" y="78" width="22" height="16"/><rect x="539" y="98" width="22" height="16"/><rect x="539" y="118" width="22" height="16"/>
  </g>

  <!-- PE grid -->
  <g>
    <rect x="300" y="145" width="290" height="290" rx="4" fill="none" stroke="#999" stroke-dasharray="4 3"/>
    <g fill="#e9f7ee" stroke="#2e8b57">
      <rect x="315" y="160" width="50" height="50" rx="4"/><rect x="385" y="160" width="50" height="50" rx="4"/><rect x="455" y="160" width="50" height="50" rx="4"/><rect x="525" y="160" width="50" height="50" rx="4"/>
      <rect x="315" y="230" width="50" height="50" rx="4"/><rect x="385" y="230" width="50" height="50" rx="4"/><rect x="455" y="230" width="50" height="50" rx="4"/><rect x="525" y="230" width="50" height="50" rx="4"/>
      <rect x="315" y="300" width="50" height="50" rx="4"/><rect x="385" y="300" width="50" height="50" rx="4"/><rect x="455" y="300" width="50" height="50" rx="4"/><rect x="525" y="300" width="50" height="50" rx="4"/>
      <rect x="315" y="370" width="50" height="50" rx="4"/><rect x="385" y="370" width="50" height="50" rx="4"/><rect x="455" y="370" width="50" height="50" rx="4"/><rect x="525" y="370" width="50" height="50" rx="4"/>
    </g>
    <g font-size="11" fill="#1f5e3a" text-anchor="middle">
      <text x="340" y="190">PE</text><text x="410" y="190">PE</text><text x="480" y="190">PE</text><text x="550" y="190">PE</text>
      <text x="340" y="260">PE</text><text x="410" y="260">PE</text><text x="480" y="260">PE</text><text x="550" y="260">PE</text>
      <text x="340" y="330">PE</text><text x="410" y="330">PE</text><text x="480" y="330">PE</text><text x="550" y="330">PE</text>
      <text x="340" y="400">PE</text><text x="410" y="400">PE</text><text x="480" y="400">PE</text><text x="550" y="400">PE</text>
    </g>
    <!-- A flow arrows (right) -->
    <g stroke="#3b6fd6" stroke-width="1.6" marker-end="url(#ar)">
      <line x1="365" y1="185" x2="383" y2="185"/><line x1="435" y1="185" x2="453" y2="185"/><line x1="505" y1="185" x2="523" y2="185"/>
      <line x1="365" y1="255" x2="383" y2="255"/><line x1="435" y1="255" x2="453" y2="255"/><line x1="505" y1="255" x2="523" y2="255"/>
      <line x1="365" y1="325" x2="383" y2="325"/><line x1="435" y1="325" x2="453" y2="325"/><line x1="505" y1="325" x2="523" y2="325"/>
      <line x1="365" y1="395" x2="383" y2="395"/><line x1="435" y1="395" x2="453" y2="395"/><line x1="505" y1="395" x2="523" y2="395"/>
      <line x1="288" y1="185" x2="313" y2="185"/><line x1="288" y1="255" x2="313" y2="255"/><line x1="288" y1="325" x2="313" y2="325"/><line x1="288" y1="395" x2="313" y2="395"/>
    </g>
    <!-- B flow arrows (down) -->
    <g stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar)">
      <line x1="340" y1="210" x2="340" y2="228"/><line x1="410" y1="210" x2="410" y2="228"/><line x1="480" y1="210" x2="480" y2="228"/><line x1="550" y1="210" x2="550" y2="228"/>
      <line x1="340" y1="280" x2="340" y2="298"/><line x1="410" y1="280" x2="410" y2="298"/><line x1="480" y1="280" x2="480" y2="298"/><line x1="550" y1="280" x2="550" y2="298"/>
      <line x1="340" y1="350" x2="340" y2="368"/><line x1="410" y1="350" x2="410" y2="368"/><line x1="480" y1="350" x2="480" y2="368"/><line x1="550" y1="350" x2="550" y2="368"/>
      <line x1="340" y1="138" x2="340" y2="158"/><line x1="410" y1="138" x2="410" y2="158"/><line x1="480" y1="138" x2="480" y2="158"/><line x1="550" y1="138" x2="550" y2="158"/>
    </g>
  </g>

  <!-- stream to skews -->
  <path d="M170 95 L200 95 L200 185 L286 185" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M170 72 L340 72 L340 136" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- PE detail -->
  <rect x="640" y="140" width="200" height="175" rx="6" fill="#f7f7f7" stroke="#666"/>
  <text x="740" y="162" text-anchor="middle" font-weight="bold" fill="#222">One PE, each step</text>
  <text x="655" y="186" fill="#333">acc += a_in x b_in</text>
  <text x="655" y="206" fill="#333">a_out &lt;= a_in (to the right)</text>
  <text x="655" y="226" fill="#333">b_out &lt;= b_in (down)</text>
  <text x="655" y="252" fill="#555" font-size="12">INT8 x INT8 -&gt; 16 bit,</text>
  <text x="655" y="269" fill="#555" font-size="12">sign-extended, 32-bit acc</text>
  <text x="655" y="292" fill="#8a5408" font-size="12">PIPE_MAC=1: product reg</text>
  <text x="655" y="307" fill="#8a5408" font-size="12">between multiply and add</text>
  <line x1="590" y1="200" x2="638" y2="200" stroke="#999" stroke-dasharray="3 3"/>

  <!-- output mux -->
  <rect x="640" y="380" width="200" height="80" rx="6" fill="#eef4ff" stroke="#3b6fd6"/>
  <text x="740" y="402" text-anchor="middle" font-weight="bold" fill="#1d3f8a">Output Stream</text>
  <text x="740" y="422" text-anchor="middle" fill="#333">row mux: C[row_idx][:] INT32</text>
  <text x="740" y="440" text-anchor="middle" fill="#333">valid / ready / last</text>
  <path d="M592 400 L638 420" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- control lines -->
  <path d="M170 435 L300 435" fill="none" stroke="#d08a1e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="235" y="428" text-anchor="middle" font-size="11" fill="#8a5408">step / clear to all PEs</text>
  <path d="M95 380 L95 135" fill="none" stroke="#d08a1e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="102" y="260" font-size="11" fill="#8a5408">in_ready</text>
  <path d="M170 470 L740 470 L740 462" fill="none" stroke="#d08a1e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="450" y="463" text-anchor="middle" font-size="11" fill="#8a5408">out_valid, row_idx</text>

  <text x="430" y="508" text-anchor="middle" font-size="12" fill="#444">A[r][k] and B[k][c] meet in PE(r,c) on step k + r + c. Latency without stalls: K + (R + C - 2 + PIPE_MAC) + R cycles.</text>
</svg>
